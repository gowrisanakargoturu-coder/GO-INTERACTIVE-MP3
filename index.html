<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-Interactive (Global Cloud Streaming)</title>
    <!-- Tailwind CSS v3 Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK v9 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0f; color: #e2e8f0; overflow-x: hidden; }
        h1, h2, h3, .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-glow-cyan { text-shadow: 0 0 10px rgba(6,182,212,0.6); }
        .glass-panel { background: rgba(18, 18, 26, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex flex-wrap justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-compact-disc text-cyan-400 text-3xl animate-spin" style="animation-duration: 8s;"></i>
            <span class="font-orbitron text-2xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 neon-glow-cyan">
                Go-Interactive
            </span>
        </div>

        <!-- SEARCH BAR (Real-time Filter) -->
        <div class="my-2 md:my-0 w-full md:w-1/3 relative">
            <input type="text" id="searchInput" oninput="filterSongs()" placeholder="Search songs or artists..." 
                class="w-full bg-gray-900/80 border border-cyan-500/30 text-cyan-200 text-sm rounded-full pl-10 pr-4 py-2 focus:outline-none focus:border-cyan-400 transition-all">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-cyan-400/60"></i>
        </div>

        <div class="flex items-center space-x-4">
            <button onclick="openAdminModal()" class="px-4 py-2 bg-cyan-600/20 hover:bg-cyan-600/40 border border-cyan-500/50 text-cyan-300 rounded-lg text-sm font-semibold transition">
                <i class="fa-solid fa-user-shield mr-2"></i>Admin Panel
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Songs List Section -->
            <section class="lg:col-span-2 space-y-4">
                <h2 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                    <i class="fa-solid fa-music"></i> Cloud Playlist
                </h2>
                
                <div id="songsList" class="space-y-3">
                    <!-- Dynamic Songs Will Be Rendered Here -->
                </div>
            </section>

            <!-- Player & Controls Section -->
            <section class="glass-panel p-6 rounded-2xl flex flex-col justify-between h-fit sticky top-24">
                <div class="text-center space-y-4">
                    <div id="posterContainer" class="w-48 h-48 mx-auto rounded-xl overflow-hidden border-2 border-cyan-500/40 shadow-lg shadow-cyan-500/10 flex items-center justify-center bg-gray-900">
                        <i class="fa-solid fa-music text-5xl text-gray-700"></i>
                    </div>
                    <div>
                        <h3 id="currentTitle" class="text-lg font-bold text-white truncate">Select a Song</h3>
                        <p id="currentArtist" class="text-sm text-gray-400 truncate">Go-Interactive Cloud Player</p>
                    </div>
                </div>

                <!-- Custom Audio Controls -->
                <audio id="audioPlayer" class="hidden"></audio>

                <div class="mt-6 space-y-4">
                    <div class="flex items-center justify-between text-xs text-cyan-300 font-mono">
                        <span id="currentTime">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                    <input type="range" id="progressBar" value="0" class="w-full accent-cyan-400 cursor-pointer">

                    <div class="flex justify-center items-center gap-6">
                        <button onclick="prevSong()" class="text-cyan-400 hover:text-white text-xl"><i class="fa-solid fa-backward-step"></i></button>
                        <button onclick="togglePlay()" id="playBtn" class="w-12 h-12 bg-cyan-500 hover:bg-cyan-400 text-black rounded-full flex items-center justify-center text-xl shadow-lg shadow-cyan-500/30 transition">
                            <i class="fa-solid fa-play"></i>
                        </button>
                        <button onclick="nextSong()" class="text-cyan-400 hover:text-white text-xl"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- JS Logic for Search Filter -->
    <script>
        // Real-Time Search Filter Functionality
        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const songElements = document.querySelectorAll('#songsList > div');

            songElements.forEach(songCard => {
                const titleText = songCard.querySelector('.song-title')?.textContent.toLowerCase() || '';
                const artistText = songCard.querySelector('.song-artist')?.textContent.toLowerCase() || '';

                if (titleText.includes(query) || artistText.includes(query)) {
                    songCard.style.display = "flex";
                } else {
                    songCard.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
